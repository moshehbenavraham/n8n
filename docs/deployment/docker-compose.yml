# Custom n8n Fork - Docker Compose Deployment
# Port: 5680 (customized from default 5678)

services:
  n8n:
    image: ghcr.io/moshehbenavraham/n8n:latest
    container_name: n8n-custom
    restart: unless-stopped
    ports:
      - "5680:5678"
    environment:
      # Database Configuration
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DB_SQLITE_VACUUM_ON_STARTUP=true
      # For PostgreSQL (uncomment and configure):
      # - DB_TYPE=postgresdb
      # - DB_POSTGRESDB_HOST=${POSTGRES_HOST}
      # - DB_POSTGRESDB_PORT=${POSTGRES_PORT:-5432}
      # - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      # - DB_POSTGRESDB_USER=${POSTGRES_USER}
      # - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}

      # n8n Configuration
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5680}

      # Security
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-false}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-}

      # Encryption
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}

      # Timezone
      - GENERIC_TIMEZONE=${TZ:-UTC}
      - TZ=${TZ:-UTC}

      # Execution Settings
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336

      # Version Tracking (custom)
      - N8N_FORK_VERSION=${N8N_FORK_VERSION:-custom}
      - N8N_UPSTREAM_VERSION=${N8N_UPSTREAM_VERSION:-unknown}

    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - n8n-network

  # Optional: PostgreSQL Database
  # Uncomment to use PostgreSQL instead of SQLite
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: n8n-postgres
  #   restart: unless-stopped
  #   environment:
  #     - POSTGRES_USER=${POSTGRES_USER:-n8n}
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  #     - POSTGRES_DB=${POSTGRES_DB:-n8n}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - n8n-network

  # Optional: Redis (for queue mode)
  # redis:
  #   image: redis:7-alpine
  #   container_name: n8n-redis
  #   restart: unless-stopped
  #   volumes:
  #     - redis_data:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - n8n-network

volumes:
  n8n_data:
  # postgres_data:
  # redis_data:

networks:
  n8n-network:
    driver: bridge
